[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "curious-signals"
version = "0.1.0"
description = "Local build and validation tooling for the curious-signals classroom kit"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7,<1.0",
]

[project.optional-dependencies]
# Everything the public `make` gates need.
dev = ["ruff>=0.12,<1.0"]
# The behavioural test suite is maintained outside this repository; these two
# extras serve that suite and are not needed for `make ci`.
test = [
    "pytest>=8.0,<9.0",
    "ruff>=0.12,<1.0",
]
browser = ["playwright>=1.58,<2"]
# Vector-preserving PDF assembly and continuous collection pagination.
papers = ["PyMuPDF>=1.28.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "build",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["curious_signals"]

# Read by Codacy's Bandit (config-file mode).
[tool.bandit]
# B101: asserts are the check mechanism in scripts/ and the analysis self-tests; CI never runs -O.
# B311: random only seeds simulated sensor noise in example-data/; nothing in this repo is crypto.
skips = ["B101", "B311"]
