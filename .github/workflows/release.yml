name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish experiment downloads
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
            exit 1
          fi

      - name: Install XML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils zip

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate before publishing
        run: |
          make validate
          make check-generated

      - name: Package downloads
        run: |
          set -euo pipefail
          mkdir -p dist
          make bundle
          mv phyphox-experiments.zip dist/
          (cd experiments/astronomy && zip -X -q ../../dist/astronomy-experiments.zip ./*.phyphox)
          cp experiments/*.phyphox experiments/astronomy/*.phyphox dist/

      # Not marked as a pre-release on purpose: releases/latest/download/<file>
      # URLs (used for phyphox QR codes) only resolve to full releases.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Curious Signals $TAG" \
            --generate-notes
