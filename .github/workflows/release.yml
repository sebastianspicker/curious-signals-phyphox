name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag whose commit is on the default branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Publish experiment downloads
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Require an existing tag on the default branch
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/${RELEASE_TAG}"
          [[ "${RELEASE_TAG}" == v* ]] || { echo "::error::Expected a v-prefixed release tag."; exit 1; }
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "${tag_commit}"
          if ! git merge-base --is-ancestor "${tag_commit}" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::The release tag is not on the default branch."
            exit 1
          fi

      - name: Install XML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils zip

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate before publishing
        run: |
          make validate
          make check-generated

      - name: Package downloads
        run: |
          set -euo pipefail
          mkdir -p dist
          make bundle
          mv phyphox-experiments.zip dist/
          (cd experiments/astronomy && zip -X -q ../../dist/astronomy-experiments.zip ./*.phyphox)
          # Drafts: XML, licences and attribution notes; the collection ZIP also
          # carries the paper companions and is not a release asset.
          make bundle-drafts
          mv output/drafts/curious-signals-draft-experiments.zip dist/
          # Individual files share one namespace in the release.
          dupes="$(for f in experiments/*.phyphox experiments/astronomy/*.phyphox experiments/drafts/*.phyphox; do basename "$f"; done | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate experiment file names: $dupes"
            exit 1
          fi
          cp experiments/*.phyphox experiments/astronomy/*.phyphox experiments/drafts/*.phyphox dist/

      # Not marked as a pre-release on purpose: releases/latest/download/<file>
      # URLs (used for phyphox QR codes) only resolve to full releases.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Curious Signals $TAG" \
            --generate-notes
